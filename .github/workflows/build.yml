name: Buildozer Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk git python3 python3-venv python3-pip build-essential libssl-dev autoconf libtool pkg-config zlib1g-dev unzip wget

      - name: Install Android SDK cmdline tools & accept ALL licenses
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest || true

          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME
          cp -r cmdline-tools $ANDROID_HOME/
          ln -s $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools

          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b00972985" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c90986d3468" > $ANDROID_HOME/licenses/android-sdk-preview-license
          # ✅新增 build‑tools‑37 license hash
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/android-sdk-build-tools-license

      - name: Create python venv & install buildozer
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install buildozer==1.5.0 python-for-android==2024.01.21 cython

      - name: Show memory before build
        run: free -h

      - name: Build android debug APK
        run: |
          source venv/bin/activate
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          buildozer android debug -- --jobs 2

      - name: Show memory after build
        if: always()
        run: free -h

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-app-apk
          path: bin/*.apk
