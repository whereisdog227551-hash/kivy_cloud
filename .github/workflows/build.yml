name: Buildozer Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-22.04
    container: ghcr.io/kivy/buildozer:latest
    timeout-minutes: 120

    steps:
      - name: Checkout source code into container
        uses: actions/checkout@v4

      - name: Build debug apk (pipe yes to skip root prompt)
        run: |
          yes | buildozer android debug --android.build_tools=34.0.0 -- --jobs 2

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-app-apk
          path: bin/*.apk
