name: Build Kivy APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build_apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config libffi-dev libssl-dev wget

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      - name: Manually fetch android cmdline‑tools & accept licenses
        run: |
          SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
          JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export JAVA_HOME
          mkdir -p $SDK_ROOT/cmdline-tools
          cd $SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-11076708_latest.zip
          ln -s $SDK_ROOT/cmdline-tools/latest $SDK_ROOT/tools
          yes | $SDK_ROOT/tools/bin/sdkmanager --licenses --sdk_root=$SDK_ROOT

      - name: Build android debug APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          buildozer android debug

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: bin/*.apk
