name: Build Kivy APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build_apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config libffi-dev libssl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      # ==========新增开始==========
      - name: Pre‑download Android SDK & accept licenses
        run: |
          # 触发buildozer下载sdk，遇到license交互直接失败忽略
          buildozer android debug || true
          # 接受sdk许可证，注意github runner路径
          yes | /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=/home/runner/.buildozer/android/platform/android-sdk
      # ==========新增结束==========

      - name: Build android debug APK
        run: buildozer android debug

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: bin/*.apk
